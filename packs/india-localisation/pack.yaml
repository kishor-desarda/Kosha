# SPDX-License-Identifier: CC-BY-4.0
id: india-localisation
name: India localisation
version: 1.0.0
licence: CC-BY-4.0
description: >-
  Item fields for HSN codes and GST rates, and units with their GST unit quantity codes (UQC).
  Rates change: check the current GST rate for each HSN code before you use it on an invoice.

# Extra item fields. Kosha keeps their values with the item.
fields:
  - key: hsn_code
    label: HSN code
    type: text
    pattern: "^[0-9]{4}([0-9]{2}){0,2}$"
    hint: Harmonised System of Nomenclature code, 4, 6 or 8 digits.
  - key: gst_rate
    label: GST rate
    type: decimal
    unit: "%"
    min: 0
    max: 100
    hint: Goods and Services Tax rate in percent for this item's HSN code.

units:
  - {code: Nos, name: Numbers (pieces), uqc: NOS}
  - {code: Kg, name: Kilograms, uqc: KGS}
  - {code: Meter, name: Metres, uqc: MTR}
  - {code: Ltr, name: Litres, uqc: LTR}
  - {code: Set, name: Sets, uqc: SET}
  - {code: Pair, name: Pairs, uqc: PRS}
  - {code: Sqm, name: Square metres, uqc: SQM}
  - {code: Box, name: Boxes, uqc: BOX}
  - {code: Roll, name: Rolls, uqc: ROL}
