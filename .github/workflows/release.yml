# SPDX-License-Identifier: AGPL-3.0-or-later
# A release: push a tag such as v1.0.0 (or v1.0.0rc1 for a release candidate). This workflow checks that the
# repository is ready (scripts/release_check.py), runs the full CI, scans the dependencies for known
# vulnerabilities, builds the Python packages and the server image, writes a software bill of materials (SBOM) for
# each, signs their build provenance, and publishes a GitHub release with everything attached.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ready:
    name: Ready to release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Version, changelog, add-in ranges and guides
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}"

  ci:
    name: Full CI
    needs: ready
    uses: ./.github/workflows/ci.yml

  audit:
    name: Known vulnerabilities in dependencies
    needs: ready
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit on the server's and the SDK's requirements
        run: |
          pip install pip-audit
          pip-audit --strict -r server/requirements.txt
          pip-audit --strict ./sdk/python

  build:
    name: Packages, image, SBOM and provenance
    needs: [ci, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # the GitHub release
      packages: write          # the image on ghcr.io
      id-token: write          # signing the provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the server and SDK packages
        run: |
          pip install build
          python -m build server --outdir dist
          python -m build sdk/python --outdir dist
      - name: Bill of materials for the packages
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/kosha-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Build provenance for the packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]] || tags="$tags,$name:latest"     # a final release only
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push the server image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          sbom: true
          provenance: mode=max
      - name: Bill of materials for the image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: dist/kosha-image-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          printf '\n**Server image:** `%s:%s`\n' "${{ steps.image.outputs.name }}" "$version" >> notes.md
          pre=""
          [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kosha $version" --notes-file notes.md $pre
