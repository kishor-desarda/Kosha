# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main, "wip/**"]     # wip/<topic>: work in progress that needs the full CI (C# builds) before merging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest
          pip install -e sdk/python
      - name: Unit tests
        run: |
          cd server && pytest -q
          cd .. && pytest -q sdk/python/tests addins/erpnext/tests addins/odoo/tests addins/dolibarr/tests addins/file-exchange/tests addins/teams/tests addins/slack/tests addins/telegram/tests addins/ldap/tests addins/oidc/tests addins/openai-compatible/tests
      - name: End-to-end API workflows (with a simulated ERPNext)
        run: cd server && python tests/test_api.py
      - name: Legacy import and duplicate checks
        run: cd server && python tests/test_import.py
      - name: Demo data loads
        run: |
          cd server
          KOSHA_DATA_DIR=$(mktemp -d) KOSHA_DISABLE_WORKER=1 python -c "from kosha.app import bootstrap; from kosha.seed import seed; bootstrap(); seed()"

  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kosha
          POSTGRES_PASSWORD: kosha-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kosha -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # every end-to-end server and script gets its own new database next to this one (tests/harness.py)
      KOSHA_TEST_DATABASE_URL: postgresql://kosha:kosha-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest "psycopg[binary]>=3.1"
          pip install -e sdk/python
      - name: Unit tests, PostgreSQL data layer and copy tool, end-to-end servers on PostgreSQL
        run: cd server && pytest -q
      - name: End-to-end API workflows on PostgreSQL
        run: cd server && python tests/harness.py run tests/test_api.py
      - name: Legacy import and duplicate checks on PostgreSQL
        run: cd server && python tests/harness.py run tests/test_import.py

  checks:
    name: Lint, licences, web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Ruff
        run: pip install ruff && ruff check server sdk addins scripts
      - name: SPDX licence headers
        run: python scripts/spdx_headers.py
      - name: Web client syntax
        run: node scripts/check_js.mjs
      - name: XML files (project files, Office manifest, AutoCAD bundle) are well-formed
        run: python -c "import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]" $(git ls-files '*.csproj' '*.props' '*.targets' '*.xml' '*.config' '*.resx' '*.addin')
      - name: PowerShell scripts (Kosha Desktop install and uninstall)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path addins -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad = 1 }
          }
          exit $bad
      - name: Shell scripts
        run: bash -n deploy/linux/install.sh

  ui:
    name: Browser smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r server/requirements.txt playwright
          pip install -e sdk/python
          python -m playwright install --with-deps chromium
      - name: Sign in and open every main screen without a script error
        run: python scripts/smoke_ui.py
      - name: Office task pane (test mode and a simulated Word)
        run: python scripts/test_office_taskpane.py

  dotnet:
    name: C# shared CAD core and Kosha Desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build and test Kosha.Client and Kosha.CadCore
        run: |
          dotnet test sdk/dotnet/Kosha.CadCore.Tests/Kosha.CadCore.Tests.csproj --configuration Release \
            --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Build and test Kosha.Desktop.Core
        run: |
          dotnet test addins/desktop/Kosha.Desktop.Core.Tests/Kosha.Desktop.Core.Tests.csproj --configuration Release \
            --logger "trx;LogFileName=desktop.trx" --results-directory test-results
      - name: Report the test count
        if: always()
        run: |
          for f in $(find test-results -name '*.trx' 2>/dev/null); do
            echo "::notice title=C# tests ($(basename "$f" .trx))::$(grep -o '<Counters [^/]*' "$f" | head -1)"
          done
      - name: Build the shared task pane (net48 and net8.0-windows)
        run: |
          set -o pipefail
          dotnet build sdk/dotnet/Kosha.CadCore.UI/Kosha.CadCore.UI.csproj --configuration Release -p:GenerateFullPaths=true -clp:NoSummary 2>&1 | tee build.log || {
            grep -E "(error|Error) [A-Z]+[0-9]+" build.log | sort -u | head -40 | sed 's/^/::error title=Task pane build::/'
            exit 1; }
      - name: Build the Kosha Desktop tray program (net8.0-windows; compiled here, run on Windows)
        run: |
          set -o pipefail
          dotnet build addins/desktop/Kosha.Desktop/Kosha.Desktop.csproj --configuration Release -p:GenerateFullPaths=true -clp:NoSummary 2>&1 | tee build.log || {
            grep -E "(error|Error) [A-Z]+[0-9]+" build.log | sort -u | head -40 | sed 's/^/::error title=Kosha Desktop build::/'
            exit 1; }
      # The AutoCAD and GStarCAD add-ins (and the shared DWG code in sdk/dotnet/Kosha.CadCore.Dwg) need the CAD
      # programs' own assemblies, so they are built on a PC with the CAD program, not here.

  dco:
    name: Signed-off commits
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          missing=0
          for c in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' $c) has no Signed-off-by line. Use git commit -s."
              missing=1
            fi
          done
          exit $missing
